name: PR to Discord

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: "https://discord.com/api/webhooks/1439028156391755869/EohlujS0sudaAtj6krL_tDaJEHoZ8XWoiSghO6fTT-Hn55bpTm59H9OXPaQ3HuY46WJH"
          DISCORD_SENDER: "GitHub PR Bot"
        with:
          args: |
            {% if github.event.action == 'opened' %}
            # New PR Created by ${{ github.event.pull_request.user.login }}
            {% elif github.event.action == 'synchronize' %}
            ## PR Updated! New commits pushed
            {% elif github.event.action == 'reopened' %}
            ## PR Reopened! Back from the dead
            {% elif github.event.action == 'closed' and github.event.pull_request.merged %}
            ## PR Merged! Successfully merged
            {% else %}
            ## PR Closed (not merged)
            {% endif %}
            
            **Link:** ${{ github.event.pull_request.html_url }}