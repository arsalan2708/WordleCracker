name: PR to Discord
on:
  pull_request:
    types: [opened, synchronize, reopened, closed, review_requested]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send to Discord
        uses: IlshatM/discord-webhook-action@v1
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          embed_title: "${{ github.event.pull_request.title }}"
          embed_url: ${{ github.event.pull_request.html_url }}
          embed_description: ${{ github.event.pull_request.body }}
          embed_color: >
            ${{ github.event.action == 'closed' && github.event.pull_request.merged == true && '5763717' || 
                github.event.action == 'closed' && '16711680' || 
                '3447003' }}
          embed_author_name: ${{ github.event.pull_request.user.login }}
          embed_author_icon: ${{ github.event.pull_request.user.avatar_url }}
          embed_fields: |
            Branch: ${{ github.event.pull_request.head.ref }} → ${{ github.event.pull_request.base.ref }}
            Status: ${{ github.event.action == 'closed' && (github.event.pull_request.merged && 'Merged' || 'Closed') || 'Open' }}