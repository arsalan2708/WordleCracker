name: PR to Discord

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: "https://discord.com/api/webhooks/1439028156391755869/EohlujS0sudaAtj6krL_tDaJEHoZ8XWoiSghO6fTT-Hn55bpTm59H9OXPaQ3HuY46WJH"
          DISCORD_SENDER: "GitHub PR Bot"
        with:
          args: >-
            {
              "embeds": [
                {
                  "title": "${{ github.event.pull_request.title }}",
                  "url": "${{ github.event.pull_request.html_url }}",
                  "description": "${{ github.event.pull_request.body || 'No description' }}",
                  "color": ${{ 
                    github.event.action == 'closed' && github.event.pull_request.merged && 65280 || 
                    github.event.action == 'closed' && 16711680 || 
                    3447003 
                  }},
                  "author": {
                    "name": "${{ github.event.pull_request.user.login }}",
                    "icon_url": "${{ github.event.pull_request.user.avatar_url }}"
                  },
                  "fields": [
                    {
                      "name": "Branch",
                      "value": "${{ github.event.pull_request.head.ref }} to ${{ github.event.pull_request.base.ref }}",
                      "inline": true
                    },
                    {
                      "name": "Status",
                      "value": "${{ 
                        github.event.action == 'closed' && (github.event.pull_request.merged && 'Merged' || 'Closed') || 
                        'Open' 
                      }}",
                      "inline": true
                    },
                    {
                      "name": "Changes",
                      "value": "${{ github.event.pull_request.changed_files }} files (+${{ github.event.pull_request.additions }}/-${{ github.event.pull_request.deletions }})",
                      "inline": false
                    }
                  ],
                  "timestamp": "${{ github.event.pull_request.updated_at }}"
                }
              ]
            }
          content_type: application/json